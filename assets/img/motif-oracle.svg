<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbbbbb"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddf64"/>
    </marker>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ec1e4"/>
    </marker>
  </defs>

  <!-- Étape 1 -->
  <rect x="290" y="10" width="520" height="64" rx="12" fill="#6ec1e415" stroke="#6ec1e4" stroke-width="2.5"/>
  <text x="550" y="37" text-anchor="middle" fill="#6ec1e4" font-size="24" font-weight="700">L'agent code : vite, dans n'importe quel langage</text>
  <text x="550" y="62" text-anchor="middle" fill="#dddddd" font-size="17">échecs · Brainfuck · M&amp;M's · COBOL…</text>

  <line x1="550" y1="74" x2="550" y2="102" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Étape 2 -->
  <rect x="265" y="106" width="570" height="70" rx="12" fill="#ffc85715" stroke="#ffc857" stroke-width="2.5"/>
  <text x="550" y="135" text-anchor="middle" fill="#ffc857" font-size="24" font-weight="700">« Succès » apparent</text>
  <text x="550" y="162" text-anchor="middle" fill="#dddddd" font-size="17">ça compile · ça tourne · l'agent s'en félicite</text>

  <!-- Fourche -->
  <line x1="430" y1="176" x2="290" y2="248" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ared)"/>
  <text x="288" y="204" text-anchor="end" fill="#ff6b6b" font-size="18" font-style="italic">sans garde-fous…</text>

  <line x1="670" y1="176" x2="810" y2="248" stroke="#7ddf64" stroke-width="2.5" marker-end="url(#agreen)"/>
  <text x="812" y="204" text-anchor="start" fill="#7ddf64" font-size="18" font-style="italic">oracles + expert qui doute</text>

  <!-- Issue rouge -->
  <rect x="45" y="252" width="480" height="160" rx="12" fill="#ff6b6b12" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="285" y="286" text-anchor="middle" fill="#ff6b6b" font-size="24" font-weight="800">Faux succès plausible</text>
  <text x="285" y="318" text-anchor="middle" fill="#eeeeee" font-size="18">« le programme fonctionne correctement »</text>
  <text x="285" y="344" text-anchor="middle" fill="#eeeeee" font-size="18">(362 880) · compilateur-template · python-chess caché</text>
  <text x="285" y="376" text-anchor="middle" fill="#999999" font-size="16" font-style="italic">indistinguable d'un vrai succès en démo</text>

  <!-- Issue verte -->
  <rect x="575" y="252" width="480" height="160" rx="12" fill="#7ddf6412" stroke="#7ddf64" stroke-width="2.5"/>
  <text x="815" y="286" text-anchor="middle" fill="#7ddf64" font-size="24" font-weight="800">Succès vérifié</text>
  <text x="815" y="318" text-anchor="middle" fill="#eeeeee" font-size="18">1630 Elo mesurés sur 400 parties (PGN conservés)</text>
  <text x="815" y="344" text-anchor="middle" fill="#eeeeee" font-size="18">diff GnuCOBOL · perft 11/11 · 38/38 tests</text>
  <text x="815" y="376" text-anchor="middle" fill="#999999" font-size="16" font-style="italic">rejouable par n'importe qui</text>

  <!-- Et après : la suite de l'histoire -->
  <line x1="815" y1="412" x2="815" y2="444" stroke="#6ec1e4" stroke-width="2.5" marker-end="url(#ablue)"/>
  <text x="828" y="435" text-anchor="start" fill="#6ec1e4" font-size="18" font-style="italic">et ensuite ?</text>

  <rect x="500" y="448" width="555" height="130" rx="12" fill="#6ec1e412" stroke="#6ec1e4" stroke-width="2.5"/>
  <text x="777" y="482" text-anchor="middle" fill="#6ec1e4" font-size="24" font-weight="800">Améliorer, optimiser : l'histoire continue</text>
  <text x="777" y="514" text-anchor="middle" fill="#eeeeee" font-size="18">monter l'Elo · le gameplay et le rendu · la vitesse</text>
  <text x="777" y="540" text-anchor="middle" fill="#eeeeee" font-size="18">→ expertise et inputs humains <tspan font-weight="800">indispensables</tspan></text>
  <text x="777" y="566" text-anchor="middle" fill="#999999" font-size="16" font-style="italic">on reste loin de Stockfish… et FIFAcher est loin d'un AAA</text>

  <!-- Morale -->
  <text x="300" y="500" text-anchor="middle" fill="#ffc857" font-size="24" font-weight="800">La différence n'est pas</text>
  <text x="300" y="530" text-anchor="middle" fill="#ffc857" font-size="24" font-weight="800">dans l'agent : elle est dans</text>
  <text x="300" y="560" text-anchor="middle" fill="#ffc857" font-size="24" font-weight="800">la vérification, et la suite.</text>
</svg>
