<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbbbbb"/>
    </marker>
  </defs>

  <!-- ===== Étage 1 : programme BF ===== -->
  <rect x="120" y="20" width="620" height="88" rx="12" fill="#7ddf6418" stroke="#7ddf64" stroke-width="2.5"/>
  <text x="430" y="55" text-anchor="middle" fill="#7ddf64" font-size="26" font-weight="700">N'importe quel programme Brainfuck</text>
  <text x="430" y="88" text-anchor="middle" fill="#dddddd" font-size="19" font-family="Menlo, Consolas, monospace">++[&gt;+++&lt;-]&gt;.  (ex. Sierpinski : 124 instructions)</text>

  <line x1="430" y1="108" x2="430" y2="150" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="137" fill="#999999" font-size="17" font-style="italic">lu et exécuté par…</text>

  <!-- ===== Étage 2 : interpréteur BF en MnM ===== -->
  <rect x="120" y="155" width="620" height="88" rx="12" fill="#ffc85715" stroke="#ffc857" stroke-width="2.5"/>
  <text x="430" y="190" text-anchor="middle" fill="#ffc857" font-size="26" font-weight="700">Interpréteur Brainfuck écrit en MnM 🍬</text>
  <text x="430" y="223" text-anchor="middle" fill="#dddddd" font-size="19">4 654 instructions… en jetons de couleur de bonbons</text>
  <!-- petits M&M's décoratifs -->
  <circle cx="95" cy="199" r="11" fill="#e63946"/><circle cx="70" cy="185" r="11" fill="#2a9d8f"/><circle cx="70" cy="213" r="11" fill="#4361ee"/>

  <line x1="430" y1="243" x2="430" y2="285" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="272" fill="#999999" font-size="17" font-style="italic">lui-même interprété par…</text>

  <!-- ===== Étage 3 : interpréteur MnM en ArnoldC ===== -->
  <rect x="120" y="290" width="620" height="88" rx="12" fill="#ff6b6b15" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="430" y="325" text-anchor="middle" fill="#ff6b6b" font-size="26" font-weight="700">Interpréteur MnM écrit en ArnoldC 💪</text>
  <text x="430" y="358" text-anchor="middle" fill="#dddddd" font-size="19" font-family="Menlo, Consolas, monospace">290 571 lignes de « IT'S SHOWTIME »</text>

  <line x1="430" y1="378" x2="430" y2="420" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="407" fill="#999999" font-size="17" font-style="italic">compilé vers la JVM par…</text>

  <!-- ===== Étage 4 : compilateur ArnoldC / JVM ===== -->
  <rect x="120" y="425" width="620" height="88" rx="12" fill="#6ec1e415" stroke="#6ec1e4" stroke-width="2.5"/>
  <text x="430" y="460" text-anchor="middle" fill="#6ec1e4" font-size="26" font-weight="700">Compilateur ArnoldC → bytecode JVM</text>
  <text x="430" y="493" text-anchor="middle" fill="#dddddd" font-size="19">…et le JIT de la JVM optimise le tout ☕</text>

  <!-- ===== Sortie ===== -->
  <line x1="430" y1="513" x2="430" y2="552" stroke="#bbbbbb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="557" width="400" height="60" rx="30" fill="#7ddf6425" stroke="#7ddf64" stroke-width="2.5"/>
  <text x="430" y="595" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">« Hello World » · 38/38 tests ✓</text>

  <!-- ===== Annotations latérales ===== -->
  <line x1="790" y1="40" x2="790" y2="500" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="815" y="120" fill="#cccccc" font-size="20" font-weight="600">Aucun étage n'a de</text>
  <text x="815" y="147" fill="#cccccc" font-size="20" font-weight="600">tableaux : chaque accès</text>
  <text x="815" y="174" fill="#cccccc" font-size="20" font-weight="600">= chaîne de if/else O(N)</text>

  <text x="815" y="250" fill="#ffc857" font-size="20" font-weight="700">≈ ×10 de code</text>
  <text x="815" y="277" fill="#ffc857" font-size="20" font-weight="700">par étage</text>

  <text x="815" y="350" fill="#cccccc" font-size="20" font-weight="600">Hello World traverse</text>
  <text x="815" y="377" fill="#cccccc" font-size="20" font-weight="600">les 3 langages : ~7,2 s</text>

  <text x="815" y="450" fill="#cccccc" font-size="20" font-weight="600">Sierpinski :</text>
  <text x="815" y="477" fill="#cccccc" font-size="20" font-weight="600">~10 min par ligne 🐌</text>
</svg>
